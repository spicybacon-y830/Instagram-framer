<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crop dat</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #272727;
      --text: #e0e0e0;
      --muted: #555;
      --muted2: #888;
      --accent: #fff;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Satoshi', sans-serif;
      font-weight: 400;
      min-height: 100dvh;
    }

    /* ─────────────────────────────
       MOBILE — colonne unique
    ───────────────────────────── */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 72px;
      gap: 28px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    h1 {
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted2);
    }

    header p { font-size: 12px; color: var(--muted); }

    /* Workspace = canvas + panel */
    .workspace {
      display: contents; /* mobile: transparent, children flow normally */
    }

    #stage-wrap {
      position: relative;
      width: min(420px, 100%);
      aspect-ratio: 1080 / 1350;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 0 1px var(--border), 0 8px 40px rgba(0,0,0,.55);
      cursor: crosshair;
      touch-action: none;
      flex-shrink: 0;
    }

    #stage-wrap.has-image { cursor: grab; }
    #stage-wrap.has-image:active { cursor: grabbing; }

    canvas#preview { width: 100%; height: 100%; display: block; }

    .panel {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ─────────────────────────────
       DESKTOP — deux colonnes
    ───────────────────────────── */
    @media (min-width: 800px) {
      body {
        flex-direction: column;
        align-items: center;
        padding: 32px 32px 48px;
        gap: 24px;
      }

      header { align-items: center; }

      .workspace {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 28px;
        width: 100%;
        max-width: 1000px;
      }

      #stage-wrap {
        /* Hauteur fixe basée sur le viewport */
        height: calc(100dvh - 120px);
        max-height: 760px;
        width: auto;          /* calculé depuis height + aspect-ratio */
        min-width: 0;
        flex-shrink: 0;
        position: sticky;
        top: 24px;
        /* Remet les valeurs mobiles à zéro */
        aspect-ratio: 1080 / 1350;
      }

      .panel {
        width: 280px;
        flex-shrink: 0;
        max-height: calc(100dvh - 120px);
        overflow-y: auto;
        scrollbar-width: none;
        position: sticky;
        top: 24px;
        /* Padding interne pour que le scroll ne coupe pas les éléments */
        padding-bottom: 24px;
      }

      .panel::-webkit-scrollbar { display: none; }
    }

    /* ─────────────────────────────
       Composants UI
    ───────────────────────────── */
    .section { display: flex; flex-direction: column; gap: 10px; }

    .section-label {
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Layout grids */
    .layout-row { display: flex; gap: 8px; }
    .layout-row.single { flex-wrap: wrap; }
    .layout-row.single .layout-btn { flex: 1 1 calc(16.66% - 7px); min-width: 0; }
    .layout-row.grids .layout-btn { flex: 1; }

    .layout-btn {
      aspect-ratio: 1080/1350;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    .layout-btn:hover { border-color: var(--muted2); }
    .layout-btn.active { border-color: #fff; background: #1a1a1a; }
    .layout-btn svg { width: 68%; height: 68%; opacity: 0.35; transition: opacity 0.15s; }
    .layout-btn.active svg, .layout-btn:hover svg { opacity: 0.9; }

    .layout-btn span {
      position: absolute;
      bottom: 5px; left: 0; right: 0;
      text-align: center;
      font-size: 9px;
      color: var(--muted2);
      letter-spacing: 0.04em;
      font-weight: 500;
    }

    .layout-btn.active span { color: var(--text); }

    /* Zoom */
    .zoom-row { display: flex; align-items: center; gap: 10px; }

    .slider-label { font-size: 12px; color: var(--muted2); width: 56px; flex-shrink: 0; }

    input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      min-width: 0;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .zoom-input-wrap { position: relative; flex-shrink: 0; }

    input#zoom-val {
      width: 54px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Satoshi', sans-serif;
      font-size: 12px;
      text-align: right;
      padding: 4px 18px 4px 6px;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }

    input#zoom-val::-webkit-outer-spin-button,
    input#zoom-val::-webkit-inner-spin-button { -webkit-appearance: none; }
    input#zoom-val:focus { border-color: var(--muted2); }

    .zoom-unit {
      position: absolute;
      right: 6px; top: 50%;
      transform: translateY(-50%);
      font-size: 11px; color: var(--muted);
      pointer-events: none;
    }

    /* Quality toggle */
    .quality-toggle {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      gap: 0;
    }

    .quality-btn {
      flex: 1;
      padding: 7px 0;
      border: none;
      border-radius: 6px;
      font-family: 'Satoshi', sans-serif;
      font-size: 12px;
      cursor: pointer;
      background: transparent;
      color: var(--muted2);
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.04em;
    }

    .quality-btn.active { background: var(--surface2); color: var(--text); font-weight: 500; }

    /* Color */
    .color-row { display: flex; align-items: center; gap: 10px; }

    input[type=color] {
      -webkit-appearance: none;
      width: 32px; height: 32px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: none;
      cursor: pointer;
      padding: 2px;
      flex-shrink: 0;
    }

    input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type=color]::-webkit-color-swatch { border: none; border-radius: 5px; }

    .color-label { font-size: 12px; color: var(--muted2); flex: 1; }

    #slot-badge { font-size: 11px; color: var(--muted); text-align: right; flex: 1; }

    .divider { height: 1px; background: var(--border); }

    /* Buttons */
    .btn-row { display: flex; gap: 8px; }

    button {
      font-family: 'Satoshi', sans-serif;
      font-weight: 400;
      flex: 1;
      padding: 11px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.25; cursor: default; }

    .btn-primary { background: #fff; color: #000; font-weight: 500; }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

    #file-input { display: none; }

    .hint { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.8; }

    @media (min-width: 800px) {
      .hint { text-align: left; }
    }
  </style>
</head>
<body>

<header>
  <h1>Crop dat</h1>
  <p>1080 × 1350 px</p>
</header>

<div class="workspace">

  <div id="stage-wrap">
    <canvas id="preview" width="1080" height="1350"></canvas>
  </div>

  <div class="panel">

    <div class="section">
      <div class="section-label">Photo</div>
      <div class="layout-row single">
        <button class="layout-btn active" data-layout="fill">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="106" height="133" rx="3" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>Plein</span>
        </button>
        <button class="layout-btn" data-layout="margin">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="106" height="133" rx="3" stroke="#fff" stroke-width="1.5" opacity=".25"/><rect x="14" y="17" width="80" height="101" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>Marges</span>
        </button>
        <button class="layout-btn" data-layout="polaroid">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="106" height="133" rx="3" stroke="#fff" stroke-width="1.5" opacity=".25"/><rect x="12" y="10" width="84" height="90" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>Polaroid</span>
        </button>
        <button class="layout-btn" data-layout="banner-bottom">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="106" height="133" rx="3" stroke="#fff" stroke-width="1.5" opacity=".25"/><rect x="1" y="1" width="106" height="94" rx="3" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>Bas</span>
        </button>
        <button class="layout-btn" data-layout="banner-top">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="106" height="133" rx="3" stroke="#fff" stroke-width="1.5" opacity=".25"/><rect x="1" y="40" width="106" height="94" rx="3" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>Haut</span>
        </button>
        <button class="layout-btn" data-layout="square">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="106" height="133" rx="3" stroke="#fff" stroke-width="1.5" opacity=".25"/><rect x="1" y="14" width="106" height="107" rx="0" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>Carré</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Grille</div>
      <div class="layout-row grids">
        <button class="layout-btn" data-layout="grid2">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="106" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="1" y="70" width="106" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>2</span>
        </button>
        <button class="layout-btn" data-layout="grid3">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="106" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="1" y="70" width="50" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="57" y="70" width="50" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>3</span>
        </button>
        <button class="layout-btn" data-layout="grid4">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="50" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="57" y="1" width="50" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="1" y="70" width="50" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="57" y="70" width="50" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>4</span>
        </button>
        <button class="layout-btn" data-layout="grid6">
          <svg viewBox="0 0 108 135" fill="none"><rect x="1" y="1" width="32" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="38" y="1" width="32" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="75" y="1" width="32" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="1" y="70" width="32" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="38" y="70" width="32" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/><rect x="75" y="70" width="32" height="64" rx="2" fill="#fff" opacity=".18" stroke="#fff" stroke-width="2"/></svg>
          <span>6</span>
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-label" style="display:flex;align-items:center;">
        <span>Ajustement</span>
        <span id="slot-badge"></span>
      </div>
      <div class="zoom-row">
        <span class="slider-label">Zoom</span>
        <input type="range" id="zoom" min="1" max="400" value="100" step="1">
        <div class="zoom-input-wrap">
          <input type="number" id="zoom-val" min="1" max="400" value="100">
          <span class="zoom-unit">%</span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-label">Fond</div>
      <div class="color-row">
        <input type="color" id="bg-color" value="#ffffff">
        <span class="color-label" id="color-hex">#ffffff</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-label">Qualité export</div>
      <div class="quality-toggle">
        <button class="quality-btn" data-quality="720">720 px</button>
        <button class="quality-btn active" data-quality="1080">1080 px</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="btn-row">
        <button class="btn-ghost" id="btn-upload">Choisir une photo</button>
        <button class="btn-ghost" id="btn-reset" disabled>Recadrer</button>
      </div>
      <button class="btn-primary" id="btn-export" disabled>Exporter PNG</button>
    </div>

    <p class="hint">Scroll ou pince pour zoomer<br>Glisse pour repositionner · Magnétisme au centre</p>

  </div>
</div>

<input type="file" id="file-input" accept="image/*" multiple>

<script>
  const canvas      = document.getElementById('preview');
  const ctx         = canvas.getContext('2d');
  const wrap        = document.getElementById('stage-wrap');
  const zoomSlider  = document.getElementById('zoom');
  const zoomInput   = document.getElementById('zoom-val');
  const bgInput     = document.getElementById('bg-color');
  const hexLabel    = document.getElementById('color-hex');
  const btnUpload   = document.getElementById('btn-upload');
  const btnReset    = document.getElementById('btn-reset');
  const btnExport   = document.getElementById('btn-export');
  const fileInput   = document.getElementById('file-input');
  const slotBadge   = document.getElementById('slot-badge');
  const layoutBtns  = document.querySelectorAll('.layout-btn');
  const qualityBtns = document.querySelectorAll('.quality-btn');

  const W = 1080, H = 1350, GAP = 6, SNAP_PX = 38;

  function getSlots(layout) {
    const hw = Math.floor((W - GAP) / 2);
    const hh = Math.floor((H - GAP) / 2);
    const tw = Math.floor((W - 2*GAP) / 3);
    const r2 = W - hw - GAP, b2 = H - hh - GAP, r3 = W - tw - GAP - tw - GAP;
    switch (layout) {
      case 'fill':          return [[0,0,W,H]];
      case 'margin':        return [[80,80,W-160,H-160]];
      case 'polaroid':      return [[80,80,W-160,H-320]];
      case 'banner-bottom': return [[0,0,W,hh*2-6]];
      case 'banner-top':    return [[0,H-hh*2+6,W,hh*2-6]];
      case 'square':        return [[0,Math.floor((H-W)/2),W,W]];
      case 'grid2':         return [[0,0,W,hh],[0,hh+GAP,W,b2]];
      case 'grid3':         return [[0,0,W,hh],[0,hh+GAP,hw,b2],[hw+GAP,hh+GAP,r2,b2]];
      case 'grid4':         return [[0,0,hw,hh],[hw+GAP,0,r2,hh],[0,hh+GAP,hw,b2],[hw+GAP,hh+GAP,r2,b2]];
      case 'grid6':         return [
        [0,0,tw,hh],[tw+GAP,0,tw,hh],[tw+GAP+tw+GAP,0,r3,hh],
        [0,hh+GAP,tw,b2],[tw+GAP,hh+GAP,tw,b2],[tw+GAP+tw+GAP,hh+GAP,r3,b2]
      ];
      default: return [[0,0,W,H]];
    }
  }

  let currentLayout = 'fill';
  let slots = [null];
  let activeSlot = 0, pendingSlot = 0;
  let bgColor = '#ffffff';
  let exportQuality = 1080;
  let snapH = false, snapV = false;

  const numSlots    = () => getSlots(currentLayout).length;
  const hasAnyImage = () => slots.some(s => s && s.img);

  function setZoomDisplay(v) {
    const r = Math.round(v);
    zoomSlider.value = r;
    zoomInput.value = r;
  }

  function updateUI() {
    const active = slots[activeSlot];
    btnReset.disabled = !(active && active.img);
    btnExport.disabled = !hasAnyImage();
    wrap.classList.toggle('has-image', hasAnyImage());
    const n = numSlots();
    slotBadge.textContent = n > 1 ? `zone ${activeSlot+1}/${n}` : '';
    if (active && active.img) setZoomDisplay(active.scale * 100);
    const dim = exportQuality === 720 ? '720 × 900' : '1080 × 1350';
    btnExport.textContent = `Exporter PNG · ${dim}`;
  }

  function draw(forExport = false) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);

    const rects = getSlots(currentLayout);
    rects.forEach(([sx,sy,sw,sh], i) => {
      const data = slots[i];
      ctx.save();
      ctx.beginPath(); ctx.rect(sx,sy,sw,sh); ctx.clip();
      if (data && data.img) {
        ctx.drawImage(data.img, data.ox, data.oy, data.img.width*data.scale, data.img.height*data.scale);
      } else if (!forExport) {
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(sx,sy,sw,sh);
        const cx=sx+sw/2, cy=sy+sh/2, arm=Math.min(sw,sh)*0.12;
        ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=4; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(cx-arm,cy); ctx.lineTo(cx+arm,cy);
        ctx.moveTo(cx,cy-arm); ctx.lineTo(cx,cy+arm); ctx.stroke();
      }
      ctx.restore();
    });

    if (!forExport) {
      if (rects.length > 1) {
        const [sx,sy,sw,sh] = rects[activeSlot];
        ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=3;
        ctx.strokeRect(sx+1.5,sy+1.5,sw-3,sh-3);
      }
      const ar = rects[activeSlot];
      if (ar) {
        const [sx,sy,sw,sh] = ar;
        ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.5; ctx.setLineDash([6,6]);
        if (snapV) { ctx.beginPath(); ctx.moveTo(sx,sy+sh/2); ctx.lineTo(sx+sw,sy+sh/2); ctx.stroke(); }
        if (snapH) { ctx.beginPath(); ctx.moveTo(sx+sw/2,sy); ctx.lineTo(sx+sw/2,sy+sh); ctx.stroke(); }
        ctx.setLineDash([]);
      }
    }
  }

  function fitSlot(i) {
    const data = slots[i];
    if (!data || !data.img) return;
    const [sx,sy,sw,sh] = getSlots(currentLayout)[i];
    const s = Math.max(sw/data.img.width, sh/data.img.height);
    data.scale = s;
    data.ox = sx + (sw - data.img.width*s)/2;
    data.oy = sy + (sh - data.img.height*s)/2;
  }

  function applySnap(i) {
    const data = slots[i];
    if (!data || !data.img) return;
    const [sx,sy,sw,sh] = getSlots(currentLayout)[i];
    const iw=data.img.width*data.scale, ih=data.img.height*data.scale;
    const icx=data.ox+iw/2, icy=data.oy+ih/2;
    const scx=sx+sw/2, scy=sy+sh/2;
    snapH = Math.abs(icx-scx) < SNAP_PX;
    snapV = Math.abs(icy-scy) < SNAP_PX;
    if (snapH) data.ox = scx-iw/2;
    if (snapV) data.oy = scy-ih/2;
  }

  function loadImage(file, idx) {
    if (!file || !file.type.startsWith('image/')) return;
    const img = new Image();
    img.onload = () => {
      slots[idx] = { img, scale:1, ox:0, oy:0 };
      fitSlot(idx);
      activeSlot = idx;
      draw(); updateUI();
    };
    img.src = URL.createObjectURL(file);
  }

  const ratio = () => canvas.getBoundingClientRect().width / W;

  function slotAt(cx, cy) {
    const rects = getSlots(currentLayout);
    for (let i=rects.length-1; i>=0; i--) {
      const [sx,sy,sw,sh] = rects[i];
      if (cx>=sx && cx<=sx+sw && cy>=sy && cy<=sy+sh) return i;
    }
    return 0;
  }

  let dragging=false, lastX=0, lastY=0, dragSlot=0;

  wrap.addEventListener('pointerdown', e => {
    const r=ratio(), rect=canvas.getBoundingClientRect();
    const cx=(e.clientX-rect.left)/r, cy=(e.clientY-rect.top)/r;
    const hit=slotAt(cx,cy);
    if (!slots[hit]?.img) {
      pendingSlot=hit; activeSlot=hit;
      updateUI(); draw(); fileInput.click(); return;
    }
    activeSlot=hit; dragging=true; dragSlot=hit;
    lastX=e.clientX; lastY=e.clientY;
    snapH=false; snapV=false;
    wrap.setPointerCapture(e.pointerId);
    updateUI(); draw();
  });

  wrap.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r=ratio(), data=slots[dragSlot];
    if (!data) return;
    data.ox+=(e.clientX-lastX)/r;
    data.oy+=(e.clientY-lastY)/r;
    lastX=e.clientX; lastY=e.clientY;
    applySnap(dragSlot); draw();
  });

  wrap.addEventListener('pointerup', () => { dragging=false; snapH=false; snapV=false; draw(); });

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const r=ratio(), rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)/r, my=(e.clientY-rect.top)/r;
    const hit=slotAt(mx,my), data=slots[hit];
    if (!data?.img) return;
    activeSlot=hit;
    const delta=e.deltaY<0?1.04:0.96;
    const ns=Math.max(0.01,Math.min(data.scale*delta,4));
    data.ox=mx-(mx-data.ox)*(ns/data.scale);
    data.oy=my-(my-data.oy)*(ns/data.scale);
    data.scale=ns;
    setZoomDisplay(ns*100);
    applySnap(hit); draw(); updateUI();
  }, { passive:false });

  let lastPinchDist=null, pinchSlot=0;

  wrap.addEventListener('touchstart', e => {
    if (e.touches.length===2) {
      const r=ratio(), rect=canvas.getBoundingClientRect();
      const mx=((e.touches[0].clientX+e.touches[1].clientX)/2-rect.left)/r;
      const my=((e.touches[0].clientY+e.touches[1].clientY)/2-rect.top)/r;
      pinchSlot=slotAt(mx,my);
    }
  }, { passive:true });

  wrap.addEventListener('touchmove', e => {
    if (!slots[pinchSlot]?.img || e.touches.length!==2) { lastPinchDist=null; return; }
    e.preventDefault();
    const [t1,t2]=e.touches;
    const dist=Math.hypot(t1.clientX-t2.clientX,t1.clientY-t2.clientY);
    if (lastPinchDist===null) { lastPinchDist=dist; return; }
    const r=ratio(), rect=canvas.getBoundingClientRect();
    const mx=((t1.clientX+t2.clientX)/2-rect.left)/r;
    const my=((t1.clientY+t2.clientY)/2-rect.top)/r;
    const data=slots[pinchSlot];
    const ns=Math.max(0.01,Math.min(data.scale*(dist/lastPinchDist),4));
    data.ox=mx-(mx-data.ox)*(ns/data.scale);
    data.oy=my-(my-data.oy)*(ns/data.scale);
    data.scale=ns; lastPinchDist=dist;
    setZoomDisplay(ns*100); applySnap(pinchSlot); draw(); updateUI();
  }, { passive:false });

  wrap.addEventListener('touchend', () => { lastPinchDist=null; });

  wrap.addEventListener('dragover', e=>e.preventDefault());
  wrap.addEventListener('drop', e => {
    e.preventDefault();
    const r=ratio(), rect=canvas.getBoundingClientRect();
    const cx=(e.clientX-rect.left)/r, cy=(e.clientY-rect.top)/r;
    const hit=slotAt(cx,cy);
    [...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach((file,i)=>{
      if (hit+i<numSlots()) loadImage(file,hit+i);
    });
  });

  layoutBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentLayout=btn.dataset.layout;
      const nc=numSlots();
      slots=Array.from({length:nc},(_,i)=>slots[i]||null);
      slots.forEach((_,i)=>fitSlot(i));
      activeSlot=Math.min(activeSlot,nc-1);
      layoutBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      snapH=false; snapV=false;
      draw(); updateUI();
    });
  });

  zoomSlider.addEventListener('input', () => {
    const data=slots[activeSlot];
    if (!data?.img) return;
    const [sx,sy,sw,sh]=getSlots(currentLayout)[activeSlot];
    const cx=sx+sw/2, cy=sy+sh/2, ns=zoomSlider.value/100;
    data.ox=cx-(cx-data.ox)*(ns/data.scale);
    data.oy=cy-(cy-data.oy)*(ns/data.scale);
    data.scale=ns; zoomInput.value=Math.round(ns*100);
    applySnap(activeSlot); draw();
  });

  function applyZoomInput() {
    const data=slots[activeSlot];
    if (!data?.img) return;
    const v=Math.max(1,Math.min(400,parseInt(zoomInput.value)||100));
    zoomInput.value=v;
    const [sx,sy,sw,sh]=getSlots(currentLayout)[activeSlot];
    const cx=sx+sw/2, cy=sy+sh/2, ns=v/100;
    data.ox=cx-(cx-data.ox)*(ns/data.scale);
    data.oy=cy-(cy-data.oy)*(ns/data.scale);
    data.scale=ns; zoomSlider.value=v;
    applySnap(activeSlot); draw();
  }

  zoomInput.addEventListener('change', applyZoomInput);
  zoomInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ applyZoomInput(); zoomInput.blur(); }});

  qualityBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      exportQuality=parseInt(btn.dataset.quality);
      qualityBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      updateUI();
    });
  });

  bgInput.addEventListener('input', () => {
    bgColor=bgInput.value; hexLabel.textContent=bgColor; draw();
  });

  fileInput.addEventListener('change', () => {
    [...fileInput.files].filter(f=>f.type.startsWith('image/')).forEach((file,i)=>{
      if (pendingSlot+i<numSlots()) loadImage(file,pendingSlot+i);
    });
    fileInput.value='';
  });

  btnUpload.addEventListener('click', () => { pendingSlot=activeSlot; fileInput.click(); });
  btnReset.addEventListener('click', () => { fitSlot(activeSlot); snapH=false; snapV=false; draw(); updateUI(); });

  btnExport.addEventListener('click', () => {
    draw(true);
    let exportCanvas=canvas;
    if (exportQuality===720) {
      const off=document.createElement('canvas');
      off.width=720; off.height=900;
      off.getContext('2d').drawImage(canvas,0,0,720,900);
      exportCanvas=off;
    }
    const link=document.createElement('a');
    link.download=`cropdat-${exportQuality===720?'720x900':'1080x1350'}.png`;
    link.href=exportCanvas.toDataURL('image/png');
    link.click();
    draw(false);
  });

  draw(); updateUI();
</script>
</body>
</html>
